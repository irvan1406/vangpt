        .font-bold { font-weight: 700; } .font-black { font-weight: 900; } .italic { font-style: italic; }

        .text-gray-400 { color: #9ca3af; } .text-gray-500 { color: #6b7280; }
        .text-red-500 { color: #ef4444; } .text-red-600 { color: #dc2626; }

        .bg-black\/50 { background-color: rgba(0,0,0,.5); } .bg-black\/60 { background-color: rgba(0,0,0,.6); } .bg-black\/70 { background-color: rgba(0,0,0,.7); }
        .bg-red-800 { background-color: #991b1b; } .bg-amber-950\/60 { background-color: rgba(69,26,3,.6); }
        .border { border: 1px solid; } .border-2 { border: 2px solid; }
        .border-b { border-bottom: 1px solid; } .border-t { border-top: 1px solid; } .border-r { border-right: 1px solid; }
        .border-l-4 { border-left: 4px solid; }
        .border-gray-800 { border-color: #1f2937; } .border-red-600 { border-color: #dc2626; }
        .border-red-900\/30 { border-color: rgba(127,29,29,.3); } .border-red-900\/40 { border-color: rgba(127,29,29,.4); } .border-red-900\/50 { border-color: rgba(127,29,29,.5); }
        .border-white\/5 { border-color: rgba(255,255,255,.05); }
        .border-amber-700\/50 { border-color: rgba(180,83,9,.5); } .border-amber-700\/60 { border-color: rgba(180,83,9,.6); }
        .bg-red-950\/40 { background-color: rgba(69,10,10,.4); }

        .rounded-2xl { border-radius: 1rem; } .rounded-full { border-radius: 9999px; }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); }

        .cursor-pointer { cursor: pointer; } .transition-all { transition: all .15s ease; }
        .-translate-x-full { transform: translateX(-100%); }
        .animate-pulse { animation: pulseVan 2s cubic-bezier(.4,0,.6,1) infinite; }
        @keyframes pulseVan { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .hover\:bg-red-600:hover { background-color: #dc2626; }
        .hover\:text-red-400:hover { color: #f87171; }
        .focus-within\:border-red-600:focus-within { border-color: #dc2626; }

        /* ===== TEMA PROFESIONAL V3 — netral, bersih, ala aplikasi AI modern ===== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: #0f1013; color: #ececf1; }
        .glass { background: #17181d; backdrop-filter: none; border-color: rgba(255,255,255,.08); }
        .gradient-text { background: none; -webkit-text-fill-color: #f5f5f7; color: #f5f5f7; }
        .red-shadow { box-shadow: 0 1px 2px rgba(0,0,0,.4); }
        .border-red-900\/30, .border-red-900\/40, .border-red-900\/50 { border-color: rgba(255,255,255,.08); }
        .border-red-600 { border-color: #dc2626; }
        .text-red-500 { color: #f87171; } .text-red-600 { color: #f87171; }
        .hover\:text-red-400:hover { color: #fca5a5; }
        .bg-red-800 { background-color: #dc2626; }
        .hover\:bg-red-600:hover { background-color: #ef4444; }
        .focus-within\:border-red-600:focus-within { border-color: #dc2626; }
        .bg-red-950\/40 { background-color: #26272e; }
        .room-item { border-color: rgba(255,255,255,.07); background: rgba(255,255,255,.03); border-radius: .65rem; }
        .room-item.aktif { border-color: rgba(220,38,38,.6); background: rgba(220,38,38,.14); }
        body.incognito #chatBox { box-shadow: inset 0 0 0 2px rgba(255,170,0,.18); }
        header.glass, #roomBar.glass { background: rgba(23,24,29,.92); }
        #chatBox { scrollbar-width: thin; }

        /* ===== Pesan ala aplikasi AI modern ===== */
        .baris-user { display: flex; justify-content: flex-end; }
        .gelembung-user { background: #26272e; color: #f3f4f6; padding: .65rem .95rem; border-radius: 1.15rem; max-width: 85%; font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
        .baris-ai { display: block; }
        .label-ai { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #f87171; margin-bottom: .3rem; }
        .isi-pesan { font-size: 15px; line-height: 1.65; color: #e8e9ec; word-break: break-word; }
        .isi-pesan .md-p { margin: 0 0 .6rem; }
        .isi-pesan .md-p:last-child { margin-bottom: 0; }
        .md-h { font-weight: 700; color: #fff; margin: .8rem 0 .4rem; line-height: 1.35; }
        .md-h.pertama { margin-top: 0; }
        .md-sub { font-weight: 700; font-size: 17px; color: #f5f5f7; margin: .8rem 0 .35rem; line-height: 1.35; }
        .isi-pesan ul, .isi-pesan ol { margin: .2rem 0 .7rem; padding-left: 1.25rem; }
        .isi-pesan li { margin: .18rem 0; }
        .isi-pesan blockquote { border-left: 3px solid rgba(255,255,255,.18); padding-left: .8rem; color: #b9bcc4; margin: .4rem 0 .7rem; }
        .isi-pesan hr { border: none; border-top: 1px solid rgba(255,255,255,.1); margin: .9rem 0; }
        .isi-pesan a { color: #f87171; text-decoration: underline; }
        .ikode { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.07); padding: .05rem .35rem; border-radius: .35rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; }
        .kotak-kode { background: #0b0c0f; border: 1px solid rgba(255,255,255,.1); border-radius: .8rem; overflow: hidden; margin: .5rem 0 .8rem; }
        .kk-head { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.05); padding: .4rem .7rem; font-size: 11px; color: #9aa0ab; }
        .kk-salin { font-size: 11px; font-weight: 600; color: #dfe3ea; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); padding: .28rem .65rem; border-radius: 9999px; cursor: pointer; }
        .kk-salin:active { background: rgba(255,255,255,.16); }
        .kotak-kode pre { margin: 0; padding: .8rem .9rem; overflow-x: auto; }
        .kotak-kode code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; color: #e6e8ec; white-space: pre; }
        .kotak-kode code .tk-tag { color: #ff7b72; }
        .kotak-kode code .tk-str { color: #a5d6ff; }
        .kotak-kode code .tk-komen { color: #8b949e; font-style: italic; }
        .kotak-kode code .tk-num { color: #79c0ff; }
        .kotak-kode code .tk-prop { color: #7ee0ff; }
        .kotak-kode code .tk-kw { color: #d2a8ff; }
        .kotak-kode code .tk-tanda { color: #9aa0ab; }
        .aksi-pesan { display: flex; gap: .4rem; margin-top: .45rem; }
        .aksi-pesan button { font-size: 11px; font-weight: 500; color: #9aa0ab; background: transparent; border: 1px solid rgba(255,255,255,.09); padding: .3rem .7rem; border-radius: 9999px; cursor: pointer; }
        .aksi-pesan button:active { background: rgba(255,255,255,.08); color: #fff; }
        .baris-user .aksi-pesan { justify-content: flex-end; }
        .area-edit { width: 100%; min-width: 220px; background: #101114; color: #f3f4f6; border: 1px solid rgba(220,38,38,.55); border-radius: .8rem; padding: .6rem .7rem; font-size: 14px; line-height: 1.5; outline: none; resize: vertical; }
        .tombol-edit { display: flex; gap: .4rem; margin-top: .5rem; }
        .tombol-edit button { font-size: 12px; font-weight: 600; padding: .45rem .85rem; border-radius: 9999px; cursor: pointer; }
        .te-kirim { background: #dc2626; color: #fff; }
        .te-batal { background: transparent; color: #9aa0ab; border: 1px solid rgba(255,255,255,.12); }
        .titik { display: inline-flex; gap: 5px; padding: .35rem 0; }
        .titik i { width: 7px; height: 7px; border-radius: 50%; background: #8b8f98; display: block; animation: titikLompat 1.2s infinite; }
        .titik i:nth-child(2) { animation-delay: .15s; } .titik i:nth-child(3) { animation-delay: .3s; }
        @keyframes titikLompat { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }

        /* ===== V4 — bar simpel, komposer gaya Muse, menu tekan-tahan, pratinjau HTML, mode berpikir ===== */
        header.glass { background: #0f1013; border-bottom: 1px solid rgba(255,255,255,.06); padding-top: .5rem; padding-bottom: .5rem; }
        #roomBtn, #suaraBtn, #chatBaruBtn { background: transparent; border: none; color: #c9ccd4; width: 38px; height: 38px; border-radius: 10px; font-size: 17px; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
        #roomBtn:active, #suaraBtn:active, #chatBaruBtn:active { background: rgba(255,255,255,.08); }
        #roomJudul { font-size: 14.5px; font-weight: 600; color: #f0f0f2; text-align: center; }
        #bungkusBawah { background: #0f1013; border-top: 1px solid rgba(255,255,255,.05); padding-top: .7rem; padding-bottom: calc(.7rem + env(safe-area-inset-bottom)); }
        .komposer { background: #1d1e23; border: 1px solid rgba(255,255,255,.09); border-radius: 26px; padding: .5rem .55rem .45rem; }
        .komposer textarea { width: 100%; background: transparent; border: none; outline: none; resize: none; font-size: 15.5px; line-height: 1.45; color: #f3f4f6; padding: .35rem .45rem 0; max-height: 150px; }
        .komposer-bawah { display: flex; align-items: center; gap: .35rem; margin-top: .25rem; }
        .tombol-pil { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #c9ccd4; font-size: 21px; background: transparent; border: none; cursor: pointer; flex: none; }
        .tombol-pil:active { background: rgba(255,255,255,.09); }
        #micBtn.merekam { background: #dc2626 !important; color: #fff !important; border-radius: 50%; }
        .pil-pikir { font-size: 12px; font-weight: 600; color: #9aa0ab; border: 1px solid rgba(255,255,255,.12); border-radius: 9999px; padding: .42rem .7rem; background: transparent; cursor: pointer; flex: none; }
        .pil-pikir.aktif { color: #fca5a5; border-color: rgba(220,38,38,.6); background: rgba(220,38,38,.13); }
        #sendBtn { width: 38px; height: 38px; border-radius: 50%; background: #dc2626; color: #fff; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; border: none; }
        #sendBtn:active { background: #ef4444; }
        .chip-berkas { font-size: 11px; color: #d8dbe2; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.09); padding: .3rem .6rem; border-radius: .6rem; margin-bottom: .4rem; max-width: 85%; word-break: break-all; }

        #menuKonteks { position: fixed; z-index: 90; background: #23242a; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 5px; min-width: 172px; box-shadow: 0 14px 34px rgba(0,0,0,.55); }
        #menuKonteks button { display: flex; width: 100%; text-align: left; padding: 10px 12px; font-size: 14px; color: #ececf1; border-radius: 9px; background: transparent; border: none; cursor: pointer; gap: 9px; align-items: center; }

        .panel-pikir summary::-webkit-details-marker { display: none; }

<body class="h-screen flex flex-col overflow-hidden">
    <div id="drawerOverlay" class="hidden fixed inset-0 bg-black/70 z-40"></div>
    <aside id="drawer" class="fixed top-0 left-0 h-full w-[300px] max-w-[85vw] z-40 glass border-r border-red-900/40 p-4 flex flex-col gap-3 -translate-x-full">
        <div class="flex items-center justify-between">

        <button id="roomBaru" class="bg-red-800 hover:bg-red-600 text-white text-xs font-bold p-3 rounded-xl">+ Room Baru</button>

        <div id="roomList" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>
        <button id="bersihRoom" class="text-[10px] text-gray-500 hover:text-red-400 tracking-widest">Hapus Isi Chat Ini</button>
        <button id="hapusSemuaRoom" class="text-[10px] text-gray-500 hover:text-red-400 tracking-widest">Hapus Semua Room</button>

    <header class="glass flex items-center gap-1 px-2">

        <span id="roomJudul" class="flex-1 truncate">VanGPT</span>

    </header>

    <div id="incogBanner" class="hidden bg-amber-950/60 border-b border-amber-700/50 text-amber-300 text-[11px] px-4 py-2 tracking-wide">Mode Incognito — chat ini TIDAK disimpan. Keluar room / refresh = hilang selamanya.</div>
<div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4">

            <p class="text-sm leading-relaxed text-gray-300">Halo, Tuan Irvan. Mau dibantu apa hari ini?</p>

    </div>

    <div id="bungkusBawah" class="glass border-t px-4">
        <div id="ollamaSettings" class="hidden mb-3 flex gap-2">
            <input type="text" id="ollamaUrl" value="http://localhost:11434" class="flex-1 bg-black border border-gray-800 p-2 rounded text-[10px] text-red-500 outline-none">
        </div>

                <div id="gambarChip" class="hidden mb-3 flex items-center gap-3 border border-white/5 rounded-2xl p-2" style="background:#1d1e23">
            <img id="gambarThumb" class="w-11 h-11 object-cover rounded-lg" alt="lampiran">
            <div class="flex-1" style="min-width:0">
                <span id="lampiranNama" class="block text-[11px] text-gray-200 truncate">Gambar terlampir</span>
                <span id="lampiranInfo" class="block text-[10px] text-gray-500">Siap dikirim ke AI.</span>
            </div>
            <button id="gambarBatal" class="text-gray-400 px-2">✕</button>
        </div>
        <div class="komposer">
            <textarea id="userInput" rows="1" placeholder="Tulis pesan..."></textarea>
            <div class="komposer-bawah">
                <button id="lampiranBtn" title="Lampirkan file / gambar" class="tombol-pil">+</button>

        function escTeks(s) {

        // ---- Renderer markdown ringan: **tebal**, judul, daftar, kutip, `kode`, dan blok kode ``` dalam kotak + tombol salin ----
        function mdInline(s) {
            const potongan = s.split(/`([^`\n]+)`/);
            return potongan.map((p, i) => {
                if (i % 2 === 1) return '<code class="ikode">' + p + '</code>';
                return p
                    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
                    .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            }).join('');
        }

        function mdTeks(seg) {
            const baris = escHtml(seg).split('\n');
            let html = '', modeList = null; const para = [];
            const tutupPara = () => { if (para.length) { html += '<p class="md-p">' + para.map(mdInline).join('<br>') + '</p>'; para.length = 0; } };
            const tutupList = () => { if (modeList) { html += modeList === 'ul' ? '</ul>' : '</ol>'; modeList = null; } };
            for (const mentah of baris) {
                const b = mentah.replace(/\s+$/, '');
                const trim = b.trim();
                if (!trim) { tutupPara(); tutupList(); continue; }
                const h = trim.match(/^(#{1,4})\s+(.*)$/);
                if (h) { tutupPara(); tutupList(); html += '<div class="md-h" style="font-size:' + (h[1].length <= 2 ? '19px' : '16px') + '">' + mdInline(h[2]) + '</div>'; continue; }
                if (/^\*\*[^*]+\*\*$/.test(trim) && trim.length <= 90) { tutupPara(); tutupList(); html += '<div class="md-sub">' + mdInline(trim) + '</div>'; continue; }
                if (/^(-{3,}|\*{3,}|_{3,})$/.test(trim)) { tutupPara(); tutupList(); html += '<hr>'; continue; }
                if (/^&gt;\s?/.test(trim)) { tutupPara(); tutupList(); html += '<blockquote>' + mdInline(trim.replace(/^&gt;\s?/, '')) + '</blockquote>'; continue; }
                const ul = trim.match(/^[-*•]\s+(.*)$/);
                const ol = trim.match(/^\d{1,3}[.)]\s+(.*)$/);
                if (ul || ol) {
                    tutupPara();
                    const jenis = ul ? 'ul' : 'ol';
                    if (modeList !== jenis) { tutupList(); html += '<' + jenis + '>'; modeList = jenis; }
                    html += '<li>' + mdInline((ul || ol)[1]) + '</li>';
                    continue;
                }
                tutupList();
                para.push(b);
            }
            tutupPara(); tutupList();
            return html;
        }

        // Pewarna sintaks ringan & aman: token dibaca dari kode MENTAH, tiap token di-escape sebelum dibungkus span.
        function sorotKode(kode, lang) {
            const L = String(lang || '').toLowerCase();
            if (!/^(html|xml|css|js|javascript|jsx|ts|typescript|json|php)$/.test(L)) return escHtml(kode);
            const pola = /(\/\*[\s\S]*?\*\/)|(\/\/[^\n]*)|(<!--[\s\S]*?-->)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|(`(?:[^`\\]|\\.)*`)|(<\/?[a-zA-Z][a-zA-Z0-9-]*)|(\b\d+(?:\.\d+)?(?:px|rem|em|%|vh|vw|ms|s)?\b)|([a-zA-Z-]+(?=\s*:))|(\b(?:function|return|const|let|var|if|else|for|while|do|new|class|extends|await|async|import|from|export|default|switch|case|break|typeof|document|window|console|true|false|null|undefined|this)\b)|([{}();,])/g;
            let hasil = '', terakhir = 0, m;
            while ((m = pola.exec(kode)) !== null) {
                hasil += escHtml(kode.slice(terakhir, m.index));
                const tok = m[0];
                let kelas = null;
                if (m[1] || m[2] || m[3]) kelas = 'tk-komen';
                else if (m[4] || m[5] || m[6]) kelas = 'tk-str';
                else if (m[7]) kelas = 'tk-tag';
                else if (m[8]) kelas = 'tk-num';
                else if (m[9]) kelas = 'tk-prop';
                else if (m[10]) kelas = 'tk-kw';
                else if (m[11]) kelas = 'tk-tanda';
                hasil += kelas ? '<span class="' + kelas + '">' + escHtml(tok) + '</span>' : escHtml(tok);
                terakhir = m.index + tok.length;
                if (tok.length === 0) pola.lastIndex++;
            }
            hasil += escHtml(kode.slice(terakhir));
            return hasil;
        }

        function renderMD(src) {
            const bagian = String(src == null ? '' : src).split(/```/);
            let html = '';
            bagian.forEach((seg, i) => {
                if (i % 2 === 1) {
                    let lang = '', kode = seg;
                    const nl = seg.indexOf('\n');
                    if (nl >= 0) { const awal = seg.slice(0, nl).trim(); if (/^[a-zA-Z0-9#+.-]{1,20}$/.test(awal)) { lang = awal; kode = seg.slice(nl + 1); } }
                    kode = kode.replace(/^\n+/, '').replace(/\n+$/, '');
                    const bisaPreview = /^(html|xml)$/i.test(lang);
                    html += '<div class="kotak-kode"><div class="kk-head"><span>' + escHtml(lang || 'kode') + '</span><div class="kk-aksi">' + (bisaPreview ? '<button type="button" class="kk-salin kk-preview">▶ Pratinjau</button>' : '') + '<button type="button" class="kk-salin">Salin</button></div></div><pre><code>' + sorotKode(kode, lang) + '</code></pre></div>';
                } else {
                    html += mdTeks(seg);
                }
            });
            return html;
        }

        async function salinTeks(teks, tombol) {

                    const ta = document.createElement('textarea');
                    ta.value = teks; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select();
                    ok = document.execCommand('copy');
                    ta.remove();
                } catch (e) {}
            }
            if (tombol) { const asal = tombol.innerText; tombol.innerText = ok ? 'Tersalin ✓' : 'Gagal'; setTimeout(() => { tombol.innerText = asal; }, 1400); }
        }

        document.getElementById('hapusSemuaRoom').addEventListener('click', () => {
            if (!confirm('Hapus SEMUA room dan seluruh riwayat chat? Tindakan ini permanen.')) return;
            rooms = [{ id: idBaru(), nama: 'Room 1', dibuat: Date.now(), pesan: [] }];
            roomAktifId = rooms[0].id; keluarIncog();
            simpanRooms(); tutupDrawer(); tampilkanPesan(); renderRoomList();
        });
        document.getElementById('bersihRoom').addEventListener('click', () => {
            if (!confirm('Hapus semua isi chat ini?')) return;
            if (modeIncog) pesanIncog = []; else { roomAktif().pesan = []; simpanRooms(); renderRoomList(); }
            tampilkanPesan();
        });

        // ---- Lampiran: gambar (vision, dikompres maks 768px) ATAU file teks/kode (isinya dibaca AI) ----
        function tampilChipLampiran() {
            if (draftGambar) {
                gambarThumb.style.display = '';
                gambarThumb.src = draftGambar;
                lampiranNama.innerText = 'Gambar terlampir';
                lampiranInfo.innerText = 'Dibaca AI sebagai gambar (vision).';
                gambarChip.classList.remove('hidden');
            } else if (draftBerkas) {
                gambarThumb.style.display = 'none';
                lampiranNama.innerText = '📎 ' + draftBerkas.nama;
                lampiranInfo.innerText = 'Isi file (' + Math.max(1, Math.round(draftBerkas.isi.length / 1024)) + ' KB teks) akan dibaca AI.';
                gambarChip.classList.remove('hidden');
            } else {
                gambarChip.classList.add('hidden');
            }
        }
        document.getElementById('lampiranBtn').addEventListener('click', () => fileGambar.click());
        fileGambar.addEventListener('change', async () => {
            const f = fileGambar.files && fileGambar.files[0];
            fileGambar.value = '';
            if (!f) return;
            if (f.type.startsWith('image/')) {
                const url = URL.createObjectURL(f);
                const img = new Image();
                img.onload = () => {
                    try {
                        const skala = Math.min(1, 768 / Math.max(img.width, img.height));
                        const cv = document.createElement('canvas');
                        cv.width = Math.round(img.width * skala); cv.height = Math.round(img.height * skala);
                        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                        draftGambar = cv.toDataURL('image/jpeg', 0.82);
                        draftBerkas = null;
                        tampilChipLampiran();
                    } catch (e) { appendMessage('ai', '⚠ Gambar gagal diproses di perangkat ini.'); }
                    URL.revokeObjectURL(url);
                };
                img.onerror = () => { URL.revokeObjectURL(url); appendMessage('ai', '⚠ File itu bukan gambar yang bisa dibaca.'); };
                img.src = url;
                return;
            }
            const ekstensiTeks = /\.(txt|md|json|js|ts|jsx|tsx|html?|css|csv|xml|log|py|java|php|sh|yml|yaml|ini|sql|kt|dart|vue|c|cpp|h|rb|go|rs)$/i.test(f.name);
            if (!ekstensiTeks && !f.type.startsWith('text/') && f.type !== 'application/json') {
                appendMessage('ai', '⚠ Format file "' + f.name + '" belum bisa dibaca AI. Yang bisa: gambar, atau file teks/kode (.txt .md .json .js .html .css .csv .py, dll).');
                return;
            }
            if (f.size > 400 * 1024) { appendMessage('ai', '⚠ File terlalu besar (maks 400 KB untuk lampiran teks).'); return; }
            try {
                const isi = await f.text();
                draftBerkas = { nama: f.name, isi: isi.slice(0, 20000) };
                draftGambar = null;
                tampilChipLampiran();
            } catch (e) { appendMessage('ai', '⚠ File gagal dibaca di perangkat ini.'); }
        });
        document.getElementById('gambarBatal').addEventListener('click', () => { draftGambar = null; draftBerkas = null; tampilChipLampiran(); });

        // ---- Suara: masukan (STT) ----
        const micBtn = document.getElementById('micBtn');
        let rekaman = null;
        micBtn.addEventListener('click', () => {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { appendMessage('ai', '🎤 Input suara tidak tersedia di perangkat ini. Pakai tombol mic di keyboard (Gboard) — hasil ucapannya masuk ke kotak pesan juga, Tuan.'); return; }
            if (rekaman) { try { rekaman.stop(); } catch (e) {} return; }
            rekaman = new SR();
            rekaman.lang = 'id-ID';
            rekaman.interimResults = false;
            micBtn.classList.add('merekam');
            rekaman.onresult = (ev) => { try { userInput.value = ev.results[0][0].transcript; userInput.dispatchEvent(new Event('input')); } catch (e) {} };
            rekaman.onend = () => { micBtn.classList.remove('merekam'); rekaman = null; userInput.focus(); };
            rekaman.onerror = (ev) => {
                micBtn.classList.remove('merekam'); rekaman = null;
                const err = ev && ev.error;
                if (err === 'not-allowed' || err === 'service-not-allowed') appendMessage('ai', '🎤 Izin mikrofon belum diberikan. Di aplikasi: Pengaturan HP → Aplikasi → VanGPT → Izin → Mikrofon → Izinkan. Di browser: ketuk ikon gembok di alamat → Izin situs → Mikrofon → Izinkan.');
                else if (err === 'network') appendMessage('ai', '🎤 Layanan suara tidak terjangkau — fitur ini memakai layanan Google di HP dan butuh internet. Coba lagi, atau pakai mic di keyboard (Gboard).');
                else if (err && err !== 'aborted' && err !== 'no-speech') appendMessage('ai', '🎤 Suara gagal (' + err + '). Coba lagi, Tuan.');
            };
            try { rekaman.start(); } catch (e) { micBtn.classList.remove('merekam'); rekaman = null; }
        });

        // ---- Suara: balasan dibacakan (TTS) ----
        function suaraAktif() { try { return localStorage.getItem(KUNCI_SUARA) === '1'; } catch (e) { return false; } }
        function segarkanSuaraBtn() { suaraBtn.style.opacity = suaraAktif() ? '1' : '0.35'; }
        suaraBtn.addEventListener('click', () => {
            const baru = !suaraAktif();
            try { localStorage.setItem(KUNCI_SUARA, baru ? '1' : '0'); } catch (e) {}
            if (!baru && 'speechSynthesis' in window) speechSynthesis.cancel();
            segarkanSuaraBtn();
        });
        function ucapkan(teks) {
            if (!suaraAktif() || !('speechSynthesis' in window)) return;
            if (/^⚠|^Koneksi/.test(teks)) return;
            try {
                speechSynthesis.cancel();
                const bersih = String(teks).replace(/[#*_`>~]/g, '').slice(0, 700);
                const u = new SpeechSynthesisUtterance(bersih);
                u.lang = 'id-ID'; u.rate = 1.03;
                speechSynthesis.speak(u);
            } catch (e) {}
        }


        // ---- Kirim (room-aware, memori per room ikut terkirim) ----
        let sedangKirim = false;
        async function prosesKirim(teksKirim, gambar, berkas) {
            if (sedangKirim) return;
            sedangKirim = true;
            try {
                const riwayat = pesanAktif().map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', text: m.g ? (m.t + ' [dengan gambar terlampir]') : (m.f ? (m.t + ' [dengan file terlampir: ' + m.f + ']') : m.t) }));
                tambahPesan('user', teksKirim, gambar, berkas ? berkas.nama : null);
                appendMessage('user', teksKirim, gambar, pesanAktif().length - 1, berkas ? berkas.nama : null);
                const loadDiv = appendMessage('ai', '', null, -1);
                loadDiv.querySelector('.isi-pesan').innerHTML = '<span class="berpikir"><span class="titik"><i></i><i></i><i></i></span><span>Berpikir… <span class="waktu-pikir">0 dtk</span></span></span>';
                const t0 = Date.now();
                const jarum = setInterval(() => { const el = loadDiv.querySelector('.waktu-pikir'); if (el) el.textContent = Math.round((Date.now() - t0) / 1000) + ' dtk'; }, 500);
                let promptKirim = teksKirim;
                if (berkas) promptKirim = '📎 File terlampir: ' + berkas.nama + '\n```\n' + berkas.isi + '\n```\n\n' + teksKirim;
                if (pikirAktif()) promptKirim += '\n\n(Catatan: pikirkan jawabanmu langkah demi langkah di dalam tag <think>...</think> terlebih dahulu, lalu tulis jawaban akhir yang rapi di luar tag itu.)';
                const result = await callWf(promptKirim, riwayat, gambar);
                clearInterval(jarum);
                tambahPesan('ai', result, null);
                tampilkanPesan();
                ucapkan(pisahPikir(result).jawab);
            } finally { sedangKirim = false; }
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (!text && !draftGambar && !draftBerkas) return;
            const gambar = draftGambar;
            const berkas = draftBerkas;
            const teksKirim = text || (gambar ? '(lihat gambar ini)' : '(lihat file terlampir ini)');
            userInput.value = '';
            userInput.style.height = 'auto';
            draftGambar = null; draftBerkas = null; tampilChipLampiran();
            prosesKirim(teksKirim, gambar, berkas);
        });

        // ---- Klik di area chat: salin kode & pratinjau HTML ----
        chatBox.addEventListener('click', (e) => {
            const btnPv = e.target.closest('.kk-preview');
            if (btnPv) {
                const kotak = btnPv.closest('.kotak-kode');
                const kode = kotak ? kotak.querySelector('code') : null;
                if (kode) bukaPreview(kode.innerText);
                return;
            }
            const btnKode = e.target.closest('.kk-salin');
            if (btnKode) {
                const kotak = btnKode.closest('.kotak-kode');
                const kode = kotak ? kotak.querySelector('code') : null;
                if (kode) salinTeks(kode.innerText, btnKode);
                return;
            }
        });

        // ---- Pratinjau HTML: render kode HTML dalam iframe layar penuh ----
        const previewOverlay = document.getElementById('previewOverlay');
        const previewFrame = document.getElementById('previewFrame');
        function bukaPreview(kodeHtml) { previewFrame.srcdoc = kodeHtml; previewOverlay.classList.remove('hidden'); }
        document.getElementById('previewTutup').addEventListener('click', () => { previewOverlay.classList.add('hidden'); previewFrame.srcdoc = ''; });

        // ---- Menu tekan-tahan pada pesan: Edit (pesan sendiri) & Salin ----
        const menuKonteks = document.getElementById('menuKonteks');
        const menuLatar = document.getElementById('menuLatar');
        let menuIdx = -1, menuRole = '';
        function tutupMenu() { menuKonteks.classList.add('hidden'); menuLatar.classList.add('hidden'); document.querySelectorAll('.tekan-aktif').forEach(el => el.classList.remove('tekan-aktif')); }
        menuLatar.addEventListener('click', tutupMenu);
        function tampilMenuKonteks(idx, role, x, y) {
            menuIdx = idx; menuRole = role;
            menuKonteks.innerHTML = (role === 'user' ? '<button type="button" data-menu="edit">✎&ensp;Edit & kirim ulang</button>' : '') + '<button type="button" data-menu="salin">⧉&ensp;Salin pesan</button>';
            menuKonteks.classList.remove('hidden');
            menuLatar.classList.remove('hidden');
            const lebar = 190, tinggi = role === 'user' ? 116 : 66;
            menuKonteks.style.left = Math.max(8, Math.min(x, window.innerWidth - lebar - 8)) + 'px';
            menuKonteks.style.top = Math.max(8, Math.min(y, window.innerHeight - tinggi - 8)) + 'px';
            if (window.navigator && navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
        }
        menuKonteks.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-menu]');
            if (!btn) return;
            const daftar = pesanAktif();
            const m = daftar[menuIdx];
            if (btn.getAttribute('data-menu') === 'salin') {
                if (m) salinTeks(pisahPikir(m.t).jawab || m.t, btn);
                setTimeout(tutupMenu, 650);
            } else if (btn.getAttribute('data-menu') === 'edit') {
                tutupMenu();
                mulaiEdit(menuIdx);
            }
        });
        let timerTekan = null, tekanX = 0, tekanY = 0;
        function batalTekan() { if (timerTekan) { clearTimeout(timerTekan); timerTekan = null; } }
        chatBox.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button, a, textarea, summary, details')) return;
            const baris = e.target.closest('[data-idx]');
            if (!baris) return;
            tekanX = e.clientX; tekanY = e.clientY;
            batalTekan();
            timerTekan = setTimeout(() => {
                baris.classList.add('tekan-aktif');
                tampilMenuKonteks(parseInt(baris.dataset.idx, 10), baris.dataset.role, tekanX, tekanY);
            }, 480);
        });
        chatBox.addEventListener('pointermove', (e) => { if (timerTekan && (Math.abs(e.clientX - tekanX) > 12 || Math.abs(e.clientY - tekanY) > 12)) batalTekan(); });
        chatBox.addEventListener('pointerup', batalTekan);
        chatBox.addEventListener('pointercancel', batalTekan);
        chatBox.addEventListener('scroll', () => { batalTekan(); if (!menuKonteks.classList.contains('hidden')) tutupMenu(); });
        chatBox.addEventListener('contextmenu', (e) => {
            const baris = e.target.closest('[data-idx]');
            if (!baris) return;
            e.preventDefault();
            tampilMenuKonteks(parseInt(baris.dataset.idx, 10), baris.dataset.role, e.clientX, e.clientY);
        });

        function mulaiEdit(idx) {
            if (sedangKirim) return;
            const daftar = pesanAktif();
            const m = daftar[idx];
            if (!m || m.r !== 'u') return;
            const baris = chatBox.querySelector('[data-idx="' + idx + '"]');
            if (!baris) return;
            const gelembung = baris.querySelector('.gelembung-user');
            if (!gelembung) return;
            const wadah = document.createElement('div');
            wadah.innerHTML = '<textarea class="area-edit" rows="3"></textarea><div class="tombol-edit"><button type="button" class="te-kirim">Kirim Ulang</button><button type="button" class="te-batal">Batal</button></div>';
            const ta = wadah.querySelector('textarea');
            ta.value = m.t;
            gelembung.replaceWith(wadah);
            ta.focus();
            try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
            wadah.querySelector('.te-batal').addEventListener('click', () => tampilkanPesan());
            wadah.querySelector('.te-kirim').addEventListener('click', () => {
                const baru = ta.value.trim();
                if (!baru) return;
                const d = pesanAktif();
                const g = d[idx] ? d[idx].g : null;
                d.length = idx; // buang pesan ini & semua sesudahnya — percakapan mulai ulang dari titik ini
                if (!modeIncog) { simpanRooms(); renderRoomList(); }
                tampilkanPesan();
                prosesKirim(baru, g || null, null);
            });
        }

        // ---- Mode berpikir (panel penalaran ala model reasoning) ----
        const pikirBtn = document.getElementById('pikirBtn');
        function pikirAktif() { try { return localStorage.getItem('vangpt_pikir') !== '0'; } catch (e) { return true; } }
        function segarkanPikirBtn() { pikirBtn.classList.toggle('aktif', pikirAktif()); }
        pikirBtn.addEventListener('click', () => {
            try { localStorage.setItem('vangpt_pikir', pikirAktif() ? '0' : '1'); } catch (e) {}
            segarkanPikirBtn();
        });

        // ---- Tombol chat baru di bar atas = buat room baru langsung ----
        document.getElementById('chatBaruBtn').addEventListener('click', () => document.getElementById('roomBaru').click());

        // ---- Kotak ketik membesar mengikuti isi (gaya komposer modern) ----
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
        });

        // ---- Init V2 ----
        muatRooms();
        segarkanSuaraBtn();
        segarkanPikirBtn();
        tampilkanPesan();
        renderRoomList();

        userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
    </script>
</body>
</html>
